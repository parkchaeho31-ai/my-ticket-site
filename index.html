<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 티켓 예매 시스템</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --primary-color: #f1c40f; --bg-color: #242333; --seat-color: #444451; }
        body { background-color: var(--bg-color); color: white; display: flex; flex-direction: column; align-items: center; font-family: 'Pretendard', sans-serif; padding: 20px; }
        .stage { background-color: #ddd; height: 50px; width: 300px; margin: 20px 0; text-align: center; color: #333; line-height: 50px; font-weight: bold; border-radius: 5px; box-shadow: 0 0 15px rgba(255,255,255,0.5); }
        .seat-grid { display: grid; grid-template-columns: repeat(10, 35px); gap: 8px; margin-bottom: 20px; }
        .seat { background-color: var(--seat-color); height: 30px; width: 35px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; transition: 0.2s; }
        .seat:hover:not(.occupied) { transform: scale(1.1); background-color: #6c5ce7; }
        .seat.selected { background-color: var(--primary-color); color: black; }
        .seat.occupied { background-color: #ffffff; opacity: 0.2; cursor: not-allowed; pointer-events: none; }
        .form-container { background: #3b3b4d; padding: 25px; border-radius: 12px; width: 320px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        h3 { margin-top: 0; color: var(--primary-color); }
        label { display: block; margin-top: 10px; font-size: 14px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border-radius: 6px; border: none; margin-top: 5px; background: #242333; color: white; }
        .info-panel { margin: 15px 0; padding: 10px; border-top: 1px solid #555; font-size: 14px; }
        button { width: 100%; padding: 12px; background: var(--primary-color); border: none; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 16px; transition: 0.3s; }
        button:hover { background: #d4ac0d; }

        /* 로딩 애니메이션 추가 */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-mask" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(36, 35, 51, 0.95); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <div style="border: 4px solid #f3f3f3; border-top: 4px solid #f1c40f; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
        <p style="margin-top: 15px; font-weight: bold;">최신 좌석 정보를 불러오고 있습니다...</p>
    </div>

    <div class="stage">무대 (STAGE)</div>
    <div id="seat-container" class="seat-grid"></div>

    <div class="form-container">
        <h3>예약 정보 입력</h3>
        <label>이름</label>
        <input type="text" id="user-name" placeholder="성함을 입력하세요">
        <label>연락처</label>
        <input type="tel" id="user-phone" placeholder="010-0000-0000">
        
        <div class="info-panel">
            <p>선택 좌석: <span id="selected-seats" style="color: #f1c40f;">없음</span></p>
            <p>총 결제 금액: <span style="color: #f1c40f;">₩<span id="total-price">0</span></span></p>
        </div>
        
        <button id="submit-btn" onclick="sendBooking()">예매 완료하기</button>
    </div>

    <script>
        const PUBLIC_KEY = "G_YDKjSv7nL1e8KP5";
        const SERVICE_ID = "service_zqkqwdj";
        const TEMPLATE_ID = "template_sxfdet8";
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbxoOzjK5J8tGOADXxJXdd9Y9Z4ZdGCjTC-MAVHImpyiAqdt1jVfMUaglbJ1NAt5m_wL/exec";

        emailjs.init(PUBLIC_KEY);
        const container = document.getElementById('seat-container');
        let selectedSeatsList = [];

        // 1. 좌석 초기 생성
        for (let i = 0; i < 100; i++) {
            const seat = document.createElement('div');
            seat.classList.add('seat');
            const row = String.fromCharCode(65 + Math.floor(i / 10));
            const col = (i % 10) + 1;
            seat.innerText = `${row}${col}`;
            
            seat.addEventListener('click', () => {
                if (!seat.classList.contains('occupied')) {
                    seat.classList.toggle('selected');
                    updateUI();
                }
            });
            container.appendChild(seat);
        }

        // 2. 구글 시트 데이터 로드
        async function loadBookedSeats() {
            const loader = document.getElementById('loading-mask');
            try {
                const res = await fetch(GOOGLE_URL + "?t=" + new Date().getTime());
                const booked = await res.json();
                
                document.querySelectorAll('.seat').forEach(s => {
                    if (booked.includes(s.innerText)) {
                        s.classList.add('occupied');
                    }
                });
                loader.style.display = 'none'; 
            } catch (e) {
                loader.innerHTML = "<p>데이터 로드 실패. 새로고침(F5) 해주세요.</p>";
            }
        }
        loadBookedSeats();

        function updateUI() {
            const selected = document.querySelectorAll('.seat.selected');
            selectedSeatsList = [...selected].map(s => s.innerText);
            document.getElementById('selected-seats').innerText = selectedSeatsList.join(', ') || '없음';
            document.getElementById('total-price').innerText = (selectedSeatsList.length * 1000).toLocaleString();
        }

        // 3. 예매하기 (즉시 반응 로직 포함)
        // 4. 예매 데이터 전송 (중복 체크 강화 버전)
        async function sendBooking() {
            const name = document.getElementById('user-name').value;
            const phone = document.getElementById('user-phone').value;
            const submitBtn = document.getElementById('submit-btn');

            if (selectedSeatsList.length === 0) return alert("좌석을 선택해주세요!");
            if (!name || !phone) return alert("이름과 연락처를 모두 입력해주세요!");

            // [중복 클릭 방지] 버튼 비활성화 및 로딩 표시
            submitBtn.disabled = true;
            submitBtn.innerText = "처리 중...";

            const params = {
                user_name: name,
                user_phone: phone,
                seats: selectedSeatsList.join(', '),
                total_price: selectedSeatsList.length * 1000
            };

            try {
                // 1. 구글 시트에 전송 (중복 체크)
                // 응답을 제대로 확인하기 위해 요청을 보냅니다.
                const response = await fetch(GOOGLE_URL, {
                    method: 'POST',
                    body: JSON.stringify(params)
                });

                const result = await response.json();

                if (result.result === "success") {
                    // 2. 시트 저장 성공 시에만 이메일 발송
                    await emailjs.send(SERVICE_ID, TEMPLATE_ID, params);
                    alert(`${name}님, 예매가 성공적으로 완료되었습니다!`);
                    location.reload();
                } else {
                    // 시트에서 "error"를 보낸 경우 (이미 예약된 좌석 등)
                    alert(result.message || "이미 예약된 좌석입니다. 다시 선택해주세요.");
                    location.reload();
                }

            } catch (err) {
                // 네트워크 오류나 CORS 이슈 발생 시
                // 보통 CORS 에러가 나도 데이터는 시트에 들어가는 경우가 많으므로 
                // 사용자에게 새로고침을 유도하여 좌석 상태를 확인하게 합니다.
                console.error("Detail:", err);
                alert("예매 상태를 확인합니다. 좌석이 이미 선택되었다면 다시 시도해주세요.");
                location.reload();
            }
        }
    </script>
</body>
</html>
